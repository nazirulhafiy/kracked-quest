# Watched paths (design/behaviour only; keep in sync with scripts/docs_check_pr.py and docs/ci-docs-check.md):
# - index.html
# - *.css, *.js, *.mjs, *.ts, *.tsx, *.jsx (repo root)
# - scripts/build.*, scripts/*build*
# - vite.config.*, wrangler.toml, package.json
name: docs-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure no-docs-needed label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "no-docs-needed" \
            --description "Design or behaviour change needs no docs/ update" \
            --color "FEF2C0" 2>/dev/null || true

      - name: Run docs check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/docs_check_pr.py
